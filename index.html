<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR component</title>
    <link rel="stylesheet" href="qr.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background-body: hsl(212, 45%, 89%);
        --text-heading-color: hsl(218, 44%, 22%);
        --text-content-color: hsl(216, 15%, 48%);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-size: 15px;
        font-family: "Outfit", sans-serif;
        background-color: var(--background-body);
      }
      .container {
        max-width: 320px;
        width: 100%;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 18px;
        background-color: white;
      }
      img {
        border-radius: 10px;
        max-width: 280px;
        width: 100%;
      }
      .title {
        font-weight: 700;
        font-size: 20px;
        text-align: center;
        color: var(--text-heading-color);
        margin: 20px 0;
        padding: 10px;
      }
      .content {
        text-align: center;
        color: var(--text-content-color);
        padding-left: 20px;
        padding-bottom: 12px;
        letter-spacing: 0.5px;
      }
      .attribution {
        text-align: center;
        position: fixed;
        bottom: 0;
        padding-bottom: 80px;
      }
      @media (max-width: 380px) {
        .attribution{
            display: flex; 
            flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <img src="images/image-qr-code.png" alt="Đây là mã Qr" />
      <h1 class="title">Improve your front-end skills by building projects</h1>
      <p class="content">
        Scan the QR code to visit Frontend Mentor and take your coding skills to
        the next level
      </p>
    </main>
    <footer class="attribution">
      <span>
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      </span>
      <span>Coded by <a href="#">Nguyen Le Hoai Phuc</a>.</span>
    </footer>
  </body>
</html>
